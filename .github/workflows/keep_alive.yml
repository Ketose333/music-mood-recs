name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright 설치
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: 앱 방문 및 로딩 확인
        env:
          APP_URL: https://music-mood-recs.streamlit.app
          APP_READY_TEXT: 음악 무드 분류 + 추천
        run: node .github/scripts/keep_alive.mjs
