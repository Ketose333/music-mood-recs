name: Auto Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js 문법 확인
        run: node --check .github/scripts/keep_alive.mjs

      - name: keep-alive 정책 확인
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/keep_alive.yml').read_text(encoding='utf-8')
          assert "cron: '17 */6 * * *'" in workflow
          assert 'contents: read' in workflow
          assert 'timeout-minutes: 10' in workflow
          assert "node-version: '22'" in workflow
          assert 'playwright@1.62.1' in workflow
          assert 'APP_URL:' in workflow
          assert 'APP_READY_TEXT:' in workflow
          assert 'node .github/scripts/keep_alive.mjs' in workflow
          assert 'gh run delete' not in workflow
          assert '|| echo' not in workflow
          print('keep-alive policy: PASS')
          PY

      - name: 추가 코드 시크릿 스캔
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          base_ref = os.environ['BASE_REF']
          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', f'origin/{base_ref}...HEAD'],
              text=True,
          )
          added = '\n'.join(
              line for line in diff.splitlines()
              if line.startswith('+') and not line.startswith('+++')
          )
          keywords = (
              'password', 'passwd', 'secret', 'token', 'api_key', 'apikey',
              'access_key', 'private_key', 'sk-', 'ghp_', 'gho_', 'glpat-',
              'AKIA', 'AIza',
          )
          pattern = re.compile(
              rf"(?:{'|'.join(map(re.escape, keywords))})['\"]?\s*[:=]\s*['\"][^'\"]{{8,}}",
              re.IGNORECASE,
          )
          if pattern.search(added):
              raise SystemExit('하드코딩된 시크릿 후보를 발견했습니다. 값은 로그에 출력하지 않습니다.')
          print('secret scan: PASS')
          PY
